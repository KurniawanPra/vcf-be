version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vcf-app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:abcdefghijklmnop}
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-vcf}
      DB_USERNAME: ${DB_USERNAME:-vcf_user}
      DB_PASSWORD: ${DB_PASSWORD:-vcf_password}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stack
      SANCTUM_STATEFUL_DOMAINS: localhost,127.0.0.1
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vcf-network

  db:
    image: mysql:8.0
    container_name: vcf-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vcf}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vcf_password}
      MYSQL_USER: ${DB_USERNAME:-vcf_user}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - vcf-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-vcf_user}", "-p${DB_PASSWORD:-vcf_password}"]
      timeout: 20s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vcf-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-vcf_user}
      PMA_PASSWORD: ${DB_PASSWORD:-vcf_password}
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vcf-network

volumes:
  db_data:
    driver: local

networks:
  vcf-network:
    driver: bridge
